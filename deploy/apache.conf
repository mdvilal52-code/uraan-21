# ── Apache reverse proxy for Next.js ─────────────────────────────────────────
# Requirements:
#   a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#
# Instructions:
#   1. Replace "yourdomain.com" with your actual domain throughout.
#   2. Obtain TLS: certbot --apache -d yourdomain.com
#   3. Copy to /etc/apache2/sites-available/om-gauri-putra.conf
#   4. Enable: a2ensite om-gauri-putra && systemctl reload apache2

<VirtualHost *:80>
    ServerName  yourdomain.com
    ServerAlias www.yourdomain.com

    # Let certbot handle ACME challenges, redirect everything else to HTTPS
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName  yourdomain.com
    ServerAlias www.yourdomain.com

    # TLS — managed by certbot or supplied manually
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    # Modern TLS settings
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # Security headers (Next.js also sends these — these are backup at proxy level)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options           "DENY"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests     Off

    # Pass real client IP
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"

    # WebSocket support (Next.js uses it for HMR in dev; harmless in prod)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]

    # Proxy all requests to Next.js
    ProxyPass        / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # Static assets — immutable cache
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Upload size limit — match what the app expects
    LimitRequestBody 52428800

    ErrorLog  ${APACHE_LOG_DIR}/om-gauri-putra-error.log
    CustomLog ${APACHE_LOG_DIR}/om-gauri-putra-access.log combined
</VirtualHost>
